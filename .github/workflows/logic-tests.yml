name: C++ logic regression

on:
  push:
    paths:
      - 'robotlar_ws/src/solve_maze/**'
      - '.github/workflows/logic-tests.yml'
  pull_request:
    paths:
      - 'robotlar_ws/src/solve_maze/**'
      - '.github/workflows/logic-tests.yml'

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile with warnings and sanitizers
        run: >-
          g++ -std=c++11 -Wall -Wextra -Werror -UNDEBUG -O1 -g
          -fsanitize=address,undefined -fno-omit-frame-pointer
          robotlar_ws/src/solve_maze/test/scan_math_test.cpp
          -o "$RUNNER_TEMP/scan_math_test"
      - name: Run isolated logic regressions
        run: '"$RUNNER_TEMP/scan_math_test"'
